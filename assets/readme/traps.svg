<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 516" width="1280" height="516" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Five numbers that looked right</title>
  <desc id="d">Five real data traps hit while building Artha. Infosys P/E: a naive lookup shows about 1,450; Artha converts US-dollar earnings to rupees and shows about 15.4. Searching for a Nifty 50 index fund matched a Nifty Next 50 fund; Artha reads Cumulative as Growth and finds the right fund. A merged fund's years-old history is rejected when its latest NAV is older than 7 days. After a 1:1 bonus, profit appears halved; Artha compares diluted, restated EPS. The close on Friday 2 October 2026 is missing because NSE was shut; Artha uses the Thursday close and names the holiday.</desc>
  <style>
    text{font-family:Inter,"Segoe UI",-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
    .mono{font-family:"JetBrains Mono","SFMono-Regular",Menlo,Consolas,"DejaVu Sans Mono",monospace}
    .bad{opacity:.45}
    .r0 .bad{animation:b0 12s linear infinite}@keyframes b0{0%,5.0%{opacity:0}7.5%,12.5%{opacity:1}15.8%,92%{opacity:.45}98%,100%{opacity:0}}.r0 .strike{animation:s0 12s linear infinite}@keyframes s0{0%,10.0%{stroke-dashoffset:1;opacity:1}13.3%,92%{stroke-dashoffset:0;opacity:1}98%,100%{stroke-dashoffset:0;opacity:0}}.r0 .good{animation:g0 12s ease-out infinite}@keyframes g0{0%,13.3%{opacity:0;transform:translateX(-10px)}16.7%,92%{opacity:1;transform:translateX(0)}98%,100%{opacity:0}}.r1 .bad{animation:b1 12s linear infinite}@keyframes b1{0%,17.5%{opacity:0}20.0%,25.0%{opacity:1}28.3%,92%{opacity:.45}98%,100%{opacity:0}}.r1 .strike{animation:s1 12s linear infinite}@keyframes s1{0%,22.5%{stroke-dashoffset:1;opacity:1}25.8%,92%{stroke-dashoffset:0;opacity:1}98%,100%{stroke-dashoffset:0;opacity:0}}.r1 .good{animation:g1 12s ease-out infinite}@keyframes g1{0%,25.8%{opacity:0;transform:translateX(-10px)}29.2%,92%{opacity:1;transform:translateX(0)}98%,100%{opacity:0}}.r2 .bad{animation:b2 12s linear infinite}@keyframes b2{0%,30.0%{opacity:0}32.5%,37.5%{opacity:1}40.8%,92%{opacity:.45}98%,100%{opacity:0}}.r2 .strike{animation:s2 12s linear infinite}@keyframes s2{0%,35.0%{stroke-dashoffset:1;opacity:1}38.3%,92%{stroke-dashoffset:0;opacity:1}98%,100%{stroke-dashoffset:0;opacity:0}}.r2 .good{animation:g2 12s ease-out infinite}@keyframes g2{0%,38.3%{opacity:0;transform:translateX(-10px)}41.7%,92%{opacity:1;transform:translateX(0)}98%,100%{opacity:0}}.r3 .bad{animation:b3 12s linear infinite}@keyframes b3{0%,42.5%{opacity:0}45.0%,50.0%{opacity:1}53.3%,92%{opacity:.45}98%,100%{opacity:0}}.r3 .strike{animation:s3 12s linear infinite}@keyframes s3{0%,47.5%{stroke-dashoffset:1;opacity:1}50.8%,92%{stroke-dashoffset:0;opacity:1}98%,100%{stroke-dashoffset:0;opacity:0}}.r3 .good{animation:g3 12s ease-out infinite}@keyframes g3{0%,50.8%{opacity:0;transform:translateX(-10px)}54.2%,92%{opacity:1;transform:translateX(0)}98%,100%{opacity:0}}.r4 .bad{animation:b4 12s linear infinite}@keyframes b4{0%,55.0%{opacity:0}57.5%,62.5%{opacity:1}65.8%,92%{opacity:.45}98%,100%{opacity:0}}.r4 .strike{animation:s4 12s linear infinite}@keyframes s4{0%,60.0%{stroke-dashoffset:1;opacity:1}63.3%,92%{stroke-dashoffset:0;opacity:1}98%,100%{stroke-dashoffset:0;opacity:0}}.r4 .good{animation:g4 12s ease-out infinite}@keyframes g4{0%,63.3%{opacity:0;transform:translateX(-10px)}66.7%,92%{opacity:1;transform:translateX(0)}98%,100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.bad,.strike,.good{animation:none!important}}
  </style>
  <rect width="1280" height="516" rx="24" fill="#13171d"/>
  <text x="48" y="58" font-size="28" font-weight="800" fill="#F3EFE8">Five numbers that looked right</text>
  <text x="48" y="90" font-size="17" fill="#9AA3AD">Each one came up while Artha was being built and tested on real data.</text>
  <text x="64" y="126" font-size="13" font-weight="700" fill="#6B7580" letter-spacing="1.5">YOU ASKED FOR</text>
  <text x="430" y="126" font-size="13" font-weight="700" fill="#6B7580" letter-spacing="1.5">A NAIVE LOOKUP SHOWED</text>
  <text x="760" y="126" font-size="13" font-weight="700" fill="#6B7580" letter-spacing="1.5">ARTHA</text>
  <g class="r0">
    <rect x="40" y="140" width="1200" height="56" rx="12" fill="#ffffff" fill-opacity=".035"/>
    <text x="64" y="175" font-size="19" font-weight="600" fill="#E6E1D9">Infosys P/E</text>
    <g class="bad"><text x="430" y="175" font-size="19" fill="#F7A6AC" class="mono">≈ 1,450</text></g>
    <line class="strike" pathLength="1" stroke-dasharray="1" x1="424" y1="169" x2="517" y2="169" stroke="#F07178" stroke-width="3" stroke-linecap="round"/>
    <g transform="translate(760 151)"><g class="good">
      <rect width="357" height="34" rx="17" fill="#12291c" stroke="#5FD38D" stroke-opacity=".6"/>
      <circle cx="18" cy="17" r="8" fill="#5FD38D"/><path d="M14 17 l3 3 l6 -6" fill="none" stroke="#0e1a13" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="23" font-size="15" font-weight="600" fill="#BDF0D0">≈ 15.4 · USD → ₹ at 93.91, disclosed</text>
    </g></g>
  </g>
  <g class="r1">
    <rect x="40" y="204" width="1200" height="56" rx="12" fill="#ffffff" fill-opacity=".015"/>
    <text x="64" y="239" font-size="19" font-weight="600" fill="#E6E1D9">Search: Nifty 50 index fund</text>
    <g class="bad"><text x="430" y="239" font-size="19" fill="#F7A6AC" class="mono">Nifty Next 50 fund</text></g>
    <line class="strike" pathLength="1" stroke-dasharray="1" x1="424" y1="233" x2="644" y2="233" stroke="#F07178" stroke-width="3" stroke-linecap="round"/>
    <g transform="translate(760 215)"><g class="good">
      <rect width="417" height="34" rx="17" fill="#12291c" stroke="#5FD38D" stroke-opacity=".6"/>
      <circle cx="18" cy="17" r="8" fill="#5FD38D"/><path d="M14 17 l3 3 l6 -6" fill="none" stroke="#0e1a13" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="23" font-size="15" font-weight="600" fill="#BDF0D0">Nifty 50 fund · “Cumulative” read as Growth</text>
    </g></g>
  </g>
  <g class="r2">
    <rect x="40" y="268" width="1200" height="56" rx="12" fill="#ffffff" fill-opacity=".035"/>
    <text x="64" y="303" font-size="19" font-weight="600" fill="#E6E1D9">NAV of a merged fund</text>
    <g class="bad"><text x="430" y="303" font-size="19" fill="#F7A6AC" class="mono">Years-old history</text></g>
    <line class="strike" pathLength="1" stroke-dasharray="1" x1="424" y1="297" x2="633" y2="297" stroke="#F07178" stroke-width="3" stroke-linecap="round"/>
    <g transform="translate(760 279)"><g class="good">
      <rect width="383" height="34" rx="17" fill="#12291c" stroke="#5FD38D" stroke-opacity=".6"/>
      <circle cx="18" cy="17" r="8" fill="#5FD38D"/><path d="M14 17 l3 3 l6 -6" fill="none" stroke="#0e1a13" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="23" font-size="15" font-weight="600" fill="#BDF0D0">Rejected · latest NAV older than 7 days</text>
    </g></g>
  </g>
  <g class="r3">
    <rect x="40" y="332" width="1200" height="56" rx="12" fill="#ffffff" fill-opacity=".015"/>
    <text x="64" y="367" font-size="19" font-weight="600" fill="#E6E1D9">EPS after a 1:1 bonus</text>
    <g class="bad"><text x="430" y="367" font-size="19" fill="#F7A6AC" class="mono">“Profit halved”</text></g>
    <line class="strike" pathLength="1" stroke-dasharray="1" x1="424" y1="361" x2="610" y2="361" stroke="#F07178" stroke-width="3" stroke-linecap="round"/>
    <g transform="translate(760 343)"><g class="good">
      <rect width="383" height="34" rx="17" fill="#12291c" stroke="#5FD38D" stroke-opacity=".6"/>
      <circle cx="18" cy="17" r="8" fill="#5FD38D"/><path d="M14 17 l3 3 l6 -6" fill="none" stroke="#0e1a13" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="23" font-size="15" font-weight="600" fill="#BDF0D0">Diluted, restated EPS · adjusted closes</text>
    </g></g>
  </g>
  <g class="r4">
    <rect x="40" y="396" width="1200" height="56" rx="12" fill="#ffffff" fill-opacity=".035"/>
    <text x="64" y="431" font-size="19" font-weight="600" fill="#E6E1D9">Close on Fri 2 Oct 2026</text>
    <g class="bad"><text x="430" y="431" font-size="19" fill="#F7A6AC" class="mono">Missing value</text></g>
    <line class="strike" pathLength="1" stroke-dasharray="1" x1="424" y1="425" x2="586" y2="425" stroke="#F07178" stroke-width="3" stroke-linecap="round"/>
    <g transform="translate(760 407)"><g class="good">
      <rect width="349" height="34" rx="17" fill="#12291c" stroke="#5FD38D" stroke-opacity=".6"/>
      <circle cx="18" cy="17" r="8" fill="#5FD38D"/><path d="M14 17 l3 3 l6 -6" fill="none" stroke="#0e1a13" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="23" font-size="15" font-weight="600" fill="#BDF0D0">Thu 1 Oct close · NSE holiday named</text>
    </g></g>
  </g>
  <text x="48" y="494" font-size="16" fill="#E8A33D" font-weight="600">Warn, convert or refuse. Never guess.</text>
