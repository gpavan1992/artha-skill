<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 412" width="1280" height="412" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">How a number gets checked</title>
  <desc id="d">How Artha answers a question in five steps. You ask, for example: what is Infosys's P/E. Claude picks the artha-analyst skill and reads its known traps. A Python script fetches public data with no keys. A trap check warns, converts or refuses. The answer gives a P/E of about 15.4 with the dollar-to-rupee rate stated. Public data is read only, from AMFI, mfapi.in, Yahoo Finance, Google News, NSE index lists and, on request, NSE filings. Your holdings, tax lots, rules and alerts stay on your machine.</desc>
  <style>
    text{font-family:Inter,"Segoe UI",-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
    .pk{animation:pk 10s ease-in-out infinite}@keyframes pk{0%{transform:translateX(0);opacity:0}4%{opacity:1}4.0%{transform:translateX(0px)}13.0%{transform:translateX(0px)}22.0%{transform:translateX(246px)}31.0%{transform:translateX(246px)}40.0%{transform:translateX(492px)}49.0%{transform:translateX(492px)}58.0%{transform:translateX(738px)}67.0%{transform:translateX(738px)}76.0%{transform:translateX(984px)}94%{opacity:1}100%{transform:translateX(984px);opacity:0}}.n0 .hl{animation:n0 10s ease-in-out infinite}@keyframes n0{0%,3.0%{opacity:0}6.0%,15.0%{opacity:1}19.0%,100%{opacity:.0}}.n1 .hl{animation:n1 10s ease-in-out infinite}@keyframes n1{0%,21.0%{opacity:0}24.0%,33.0%{opacity:1}37.0%,100%{opacity:.0}}.n2 .hl{animation:n2 10s ease-in-out infinite}@keyframes n2{0%,39.0%{opacity:0}42.0%,51.0%{opacity:1}55.0%,100%{opacity:.0}}.n3 .hl{animation:n3 10s ease-in-out infinite}@keyframes n3{0%,57.0%{opacity:0}60.0%,69.0%{opacity:1}73.0%,100%{opacity:.0}}.n4 .hl{animation:n4 10s ease-in-out infinite}@keyframes n4{0%,75.0%{opacity:0}78.0%,87.0%{opacity:1}91.0%,100%{opacity:.0}}
    @media (prefers-reduced-motion:reduce){.hl,.pk{animation:none!important}.pk{opacity:0}}
  </style>
