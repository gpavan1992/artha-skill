    <circle cx="30" cy="34" r="14" fill="#C9CED4" fill-opacity=".18"/><text x="30" y="39.5" text-anchor="middle" font-size="14" font-weight="800" fill="#C9CED4">1</text>
    <text x="54" y="40" font-size="19" font-weight="800" fill="#F3EFE8">You ask</text>
    <text x="18" y="86" font-size="15" fill="#C9CED4">“What is Infosys's P/E?”</text>
  </g>
