    <text x="54" y="40" font-size="19" font-weight="800" fill="#F3EFE8">Answer</text>
    <text x="18" y="86" font-size="15" fill="#C9CED4">P/E ≈ 15.4, with the</text><text x="18" y="108" font-size="15" fill="#C9CED4">rupee rate stated.</text>
