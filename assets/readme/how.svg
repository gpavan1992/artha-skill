  <text x="40" y="58" font-size="28" font-weight="800" fill="#F3EFE8">How a number gets checked</text>
  <text x="40" y="88" font-size="17" fill="#9AA3AD">Scripts compute. Claude explains. Every warning reaches you.</text>
