<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Eight skills</title>
  <desc id="d">Artha's eight skills. For your funds: artha-navigator for real NAVs and returns, artha-xray for overlap across funds, artha-tax for capital gains and ELSS lock-ins. For your money: artha-ledger for spend from bank alerts. For stocks: artha-ticker for prices and the NSE calendar, artha-analyst for reported financials and P/E, artha-pulse for news that names the company, artha-scout to screen stocks against your rules.</desc>
