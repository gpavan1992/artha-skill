<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Artha</title>
  <desc id="d">Artha: checkable numbers for Indian investors, inside Claude. A fund value line draws across a chart while three data traps are caught: an NSE holiday gap uses the last trading close, a US-dollar EPS is converted to rupees, and a stale scheme code is rejected.</desc>
  <style>
    text{font-family:Inter,"Segoe UI",-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
    .mono{font-family:"JetBrains Mono","SFMono-Regular",Menlo,Consolas,"DejaVu Sans Mono",monospace}
    .line{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 10s ease-in-out infinite}
    .gap{animation:gap 10s linear infinite}
    .c1{animation:c1 10s ease-out infinite}
    .c2{animation:c2 10s ease-out infinite}
    .c3{animation:c3 10s ease-out infinite}
    .dot{animation:dot 10s ease-in-out infinite}
    @keyframes draw{0%{stroke-dashoffset:1}32%,92%{stroke-dashoffset:0;opacity:1}98%,100%{stroke-dashoffset:0;opacity:0}}
    @keyframes gap{0%,17%{opacity:0}20%,92%{opacity:1}98%,100%{opacity:0}}
    @keyframes dot{0%,30%{opacity:0;transform:scale(.4)}34%,92%{opacity:1;transform:scale(1)}98%,100%{opacity:0}}
    @keyframes c1{0%,20%{opacity:0;transform:translateY(8px)}24%,92%{opacity:1;transform:translateY(0)}98%,100%{opacity:0}}
    @keyframes c2{0%,36%{opacity:0;transform:translateY(8px)}40%,92%{opacity:1;transform:translateY(0)}98%,100%{opacity:0}}
    @keyframes c3{0%,48%{opacity:0;transform:translateY(8px)}52%,92%{opacity:1;transform:translateY(0)}98%,100%{opacity:0}}
    .dot{transform-box:fill-box;transform-origin:center}
    @media (prefers-reduced-motion:reduce){.line,.gap,.c1,.c2,.c3,.dot{animation:none}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171c22"/>
      <stop offset="1" stop-color="#10141a"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8A33D" stop-opacity=".28"/>
      <stop offset="1" stop-color="#E8A33D" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="24" fill="url(#grid)"/>

  <!-- Brand -->
  <g transform="translate(72 52)">
    <rect width="96" height="96" rx="22" fill="#E8A33D"/>
    <rect x="17" y="52" width="16" height="30" rx="5" fill="#161a1f"/>
    <rect x="40" y="38" width="16" height="44" rx="5" fill="#161a1f"/>
    <rect x="63" y="20" width="16" height="62" rx="5" fill="#161a1f"/>
    <path d="M18 54 L46 40 L58 46 L84 18" fill="none" stroke="#161a1f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="72" y="240" font-size="92" font-weight="800" fill="#F3EFE8" letter-spacing="-2">Artha</text>
  <rect x="76" y="258" width="64" height="6" rx="3" fill="#E8A33D"/>
  <text x="72" y="312" font-size="26" font-weight="500" fill="#C9CED4">Checkable numbers for Indian investors,</text>
  <text x="72" y="346" font-size="26" font-weight="500" fill="#C9CED4">inside Claude.</text>

  <!-- Chart panel -->
  <g transform="translate(640 48)">
    <rect width="576" height="324" rx="18" fill="#0c1015" stroke="#2a313a"/>
    <text x="24" y="38" font-size="15" font-weight="600" fill="#9AA3AD" class="mono">Sample fund · weekly value vs Nifty 500</text>
    <g stroke="#ffffff" stroke-opacity=".06">
      <line x1="24" y1="96" x2="552" y2="96"/>
      <line x1="24" y1="152" x2="552" y2="152"/>
      <line x1="24" y1="208" x2="552" y2="208"/>
      <line x1="24" y1="264" x2="552" y2="264"/>
    </g>
    <!-- benchmark -->
    <path d="M24 236 L84 230 L144 226 L204 222 L264 216 L324 214 L384 206 L444 200 L504 196 L552 190" fill="none" stroke="#5B6672" stroke-width="2" stroke-dasharray="6 6"/>
    <!-- area + fund line -->
    <path d="M24 240 L84 226 L144 232 L204 206 L264 214 L324 190 L384 172 L444 178 L504 146 L552 122 L552 290 L24 290 Z" fill="url(#area)" class="gap"/>
    <path class="line" pathLength="1" d="M24 240 L84 226 L144 232 L204 206 L264 214 L324 190 L384 172 L444 178 L504 146 L552 122" fill="none" stroke="#E8A33D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- holiday gap marker -->
    <g class="gap">
      <line x1="264" y1="84" x2="264" y2="290" stroke="#7FB7FF" stroke-opacity=".55" stroke-dasharray="3 5"/>
    </g>
    <circle class="dot" cx="552" cy="122" r="7" fill="#E8A33D" stroke="#0c1015" stroke-width="3"/>
    <text x="460" y="306" font-size="13" fill="#5B6672" class="mono">— Nifty 500</text>
    <text x="24" y="306" font-size="13" fill="#5B6672" class="mono">real NAVs, no estimates</text>
  </g>

  <!-- Trap chips -->
  <g transform="translate(676 140)"><g class="c1">
    <rect width="246" height="34" rx="17" fill="#13233a" stroke="#7FB7FF" stroke-opacity=".6"/>
    <text x="16" y="22" font-size="14" font-weight="600" fill="#BFDBFF">2 Oct holiday → last close used</text>
  </g></g>
  <g transform="translate(916 96)"><g class="c2">
    <rect width="284" height="34" rx="17" fill="#2a2111" stroke="#E8A33D" stroke-opacity=".7"/>
    <text x="16" y="22" font-size="14" font-weight="600" fill="#F6CF8F">USD EPS → ₹ at 93.91 · P/E ≈ 15.4</text>
  </g></g>
  <g transform="translate(700 196)"><g class="c3">
    <rect width="262" height="34" rx="17" fill="#2b1517" stroke="#F07178" stroke-opacity=".7"/>
    <text x="16" y="22" font-size="14" font-weight="600" fill="#F7B3B8">Stale scheme code → rejected</text>
  </g></g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
