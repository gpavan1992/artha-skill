<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 430" width="1280" height="430" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Use Artha with your broker's connector</title>
  <desc id="d">Your broker's MCP connector, such as INDmoney, Zerodha Kite or Groww, tells Claude what you own. Claude saves it to a local file, runs the Artha skill and explains every warning. Artha checks the numbers: navigator for weekly value against the Nifty 500, xray for overlap across funds, ticker and analyst for moves, P/E and financials, pulse for why a stock moved, and tax for the cost of selling, which needs purchase dates for each lot.</desc>
  <style>
    text{font-family:Inter,"Segoe UI",-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
    .flow{animation:f 1.4s linear infinite}@keyframes f{to{stroke-dashoffset:-24}}
    @media (prefers-reduced-motion:reduce){.flow{animation:none}}
  </style>
  <rect width="1280" height="430" rx="24" fill="#13171d"/>
  <text x="40" y="56" font-size="28" font-weight="800" fill="#F3EFE8">Your broker says what you own. Artha checks what it means.</text>
  <text x="40" y="88" font-size="16" fill="#9AA3AD">Artha never connects to your broker. Claude moves the data between them, on your machine.</text>
  <g transform="translate(40 128)"><rect width="300" height="76" rx="14" fill="#1a2028" stroke="#2a313a"/>
    <text x="20" y="32" font-size="19" font-weight="800" fill="#F3EFE8">INDmoney</text><text x="20" y="56" font-size="14" fill="#9AA3AD">Net worth, funds, stocks, US stocks</text></g><path class="flow" d="M344 166 C 400 166, 400 262, 456 262" fill="none" stroke="#7FB7FF" stroke-opacity=".55" stroke-width="2" stroke-dasharray="6 6"/><g transform="translate(40 220)"><rect width="300" height="76" rx="14" fill="#1a2028" stroke="#2a313a"/>
    <text x="20" y="32" font-size="19" font-weight="800" fill="#F3EFE8">Zerodha Kite</text><text x="20" y="56" font-size="14" fill="#9AA3AD">Stock and fund holdings, positions</text></g><path class="flow" d="M344 258 C 400 258, 400 262, 456 262" fill="none" stroke="#7FB7FF" stroke-opacity=".55" stroke-width="2" stroke-dasharray="6 6"/><g transform="translate(40 312)"><rect width="300" height="76" rx="14" fill="#1a2028" stroke="#2a313a"/>
    <text x="20" y="32" font-size="19" font-weight="800" fill="#F3EFE8">Groww</text><text x="20" y="56" font-size="14" fill="#9AA3AD">Stock and F&amp;O holdings, positions</text></g><path class="flow" d="M344 350 C 400 350, 400 262, 456 262" fill="none" stroke="#7FB7FF" stroke-opacity=".55" stroke-width="2" stroke-dasharray="6 6"/><g transform="translate(460 176)"><rect width="300" height="172" rx="16" fill="#1a2028" stroke="#E8A33D" stroke-opacity=".7" stroke-width="1.5"/>
 <text x="22" y="40" font-size="20" font-weight="800" fill="#F3EFE8">Claude</text>
 <text x="22" y="72" font-size="14.5" fill="#C9CED4">1. Reads what you own</text>
 <text x="22" y="98" font-size="14.5" fill="#C9CED4">2. Saves it to a local file</text>
 <text x="22" y="124" font-size="14.5" fill="#C9CED4">3. Runs the Artha skill</text>
 <text x="22" y="150" font-size="14.5" fill="#C9CED4">4. Explains every warning</text></g><path class="flow" d="M764 262 H 856" fill="none" stroke="#E8A33D" stroke-opacity=".7" stroke-width="2" stroke-dasharray="6 6"/><path d="M850 256 L858 262 L850 268" fill="none" stroke="#E8A33D" stroke-width="2"/><g transform="translate(862 104)"><rect width="378" height="290" rx="16" fill="#1a2028" stroke="#5FD38D" stroke-opacity=".6" stroke-width="1.5"/>
 <text x="22" y="40" font-size="20" font-weight="800" fill="#F3EFE8">Artha checks the numbers</text><circle cx="30" cy="78" r="5" fill="#5FD38D"/><text x="46" y="83" font-size="15.5"><tspan font-weight="700" fill="#BDF0D0">navigator</tspan><tspan fill="#9AA3AD">  weekly value vs Nifty 500</tspan></text><circle cx="30" cy="124" r="5" fill="#5FD38D"/><text x="46" y="129" font-size="15.5"><tspan font-weight="700" fill="#BDF0D0">xray</tspan><tspan fill="#9AA3AD">  overlap across funds</tspan></text><circle cx="30" cy="170" r="5" fill="#5FD38D"/><text x="46" y="175" font-size="15.5"><tspan font-weight="700" fill="#BDF0D0">ticker · analyst</tspan><tspan fill="#9AA3AD">  moves, P/E, financials</tspan></text><circle cx="30" cy="216" r="5" fill="#5FD38D"/><text x="46" y="221" font-size="15.5"><tspan font-weight="700" fill="#BDF0D0">pulse</tspan><tspan fill="#9AA3AD">  why a stock moved</tspan></text><circle cx="30" cy="262" r="5" fill="#5FD38D"/><text x="46" y="267" font-size="15.5"><tspan font-weight="700" fill="#BDF0D0">tax</tspan><tspan fill="#9AA3AD">  cost of selling (needs lot dates)</tspan></text></g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
